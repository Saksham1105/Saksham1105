<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Mobile District icon: campus buildings -->
  <!-- Main building (wide, low) -->
  <rect x="3" y="10" width="18" height="10" fill="#0a1e2e" rx="1.5"/>
  <rect x="3" y="10" width="18" height="2" fill="#5ecca0" opacity="0.6" rx="1.5"/>
  <!-- Windows teal -->
  <rect x="5" y="14" width="2" height="2" fill="#5ecca0" opacity="0.6" rx="0.3"/>
  <rect x="8.5" y="14" width="2" height="2" fill="#5ecca0" opacity="0.6" rx="0.3"/>
  <rect x="12" y="14" width="2" height="2" fill="#5ecca0" opacity="0.6" rx="0.3"/>
  <rect x="15.5" y="14" width="2" height="2" fill="#5ecca0" opacity="0.6" rx="0.3"/>
  <!-- Secondary building -->
  <rect x="23" y="14" width="7" height="8" fill="#092030" rx="1"/>
  <rect x="23" y="14" width="7" height="1.5" fill="#5ecca0" opacity="0.5"/>
  <rect x="24.5" y="17" width="1.8" height="1.8" fill="#5ecca0" opacity="0.5" rx="0.3"/>
  <rect x="27.5" y="17" width="1.8" height="1.8" fill="#5ecca0" opacity="0.5" rx="0.3"/>
  <!-- Connecting walkway -->
  <rect x="21" y="18" width="2" height="1" fill="#5ecca0" opacity="0.3"/>
  <!-- Ground -->
  <rect x="2" y="22" width="28" height="2" fill="#08161e" rx="1"/>
  <!-- Campus path -->
  <line x1="10" y1="22" x2="10" y2="28" stroke="#5ecca0" stroke-width="0.5" opacity="0.3"/>
  <line x1="20" y1="22" x2="20" y2="28" stroke="#5ecca0" stroke-width="0.5" opacity="0.3"/>
</svg>
