<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- AI Lab icon: dome + antenna -->
  <!-- Dome base -->
  <ellipse cx="16" cy="20" rx="11" ry="5" fill="#0f2040" stroke="#4a9eff" stroke-width="0.8" opacity="0.9"/>
  <!-- Dome arch -->
  <path d="M 5 20 A 11 13 0 0 1 27 20" fill="#0d1e35" stroke="#4a9eff" stroke-width="0.8"/>
  <!-- Central antenna -->
  <line x1="16" y1="7" x2="16" y2="20" stroke="#4a9eff" stroke-width="1" opacity="0.8"/>
  <!-- Antenna tip glow -->
  <circle cx="16" cy="7" r="1.8" fill="#4a9eff" opacity="0.9"/>
  <!-- Side satellite nodes -->
  <circle cx="7" cy="19" r="1.2" fill="#4a9eff" opacity="0.6"/>
  <circle cx="25" cy="19" r="1.2" fill="#4a9eff" opacity="0.6"/>
  <!-- Connection lines -->
  <line x1="7" y1="19" x2="16" y2="20" stroke="#4a9eff" stroke-width="0.5" opacity="0.4"/>
  <line x1="25" y1="19" x2="16" y2="20" stroke="#4a9eff" stroke-width="0.5" opacity="0.4"/>
  <!-- Ground -->
  <rect x="4" y="24" width="24" height="2" fill="#0d1e35" rx="1"/>
</svg>
