<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <defs>
    <linearGradient id="os-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1a26"/>
      <stop offset="60%" stop-color="#12273b"/>
      <stop offset="100%" stop-color="#091420"/>
    </linearGradient>
    <linearGradient id="os-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6db3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5ecca0" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="240" rx="12" fill="url(#os-bg)"/>
  <rect width="798" height="238" x="1" y="1" rx="11" fill="none" stroke="#6db3ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Academic Library & AI Assistant Graphic Accent (Right side) -->
  <g opacity="0.25">
    <!-- Open Book / Syllabus Grid -->
    <path d="M 570 120 C 600 110 630 115 650 125 C 670 115 700 110 730 120 L 730 185 C 700 175 670 180 650 190 C 630 180 600 175 570 185 Z" fill="none" stroke="#6db3ff" stroke-width="1.5"/>
    <line x1="650" y1="125" x2="650" y2="190" stroke="#6db3ff" stroke-width="1.5"/>
    
    <!-- AI Spark Stars Above Book -->
    <path d="M 650 60 L 654 75 L 669 79 L 654 83 L 650 98 L 646 83 L 631 79 L 646 75 Z" fill="#6db3ff"/>
    <path d="M 690 70 L 692 78 L 700 80 L 692 82 L 690 90 L 688 82 L 680 80 L 688 78 Z" fill="#c9a84c"/>
  </g>

  <!-- Left Content Info -->
  <!-- District Badge -->
  <rect x="36" y="32" width="144" height="24" rx="12" fill="#6db3ff" fill-opacity="0.15" stroke="#6db3ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="108" y="48" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#6db3ff" text-anchor="middle" letter-spacing="1.5">🏙 WEB CITY · 02</text>
  
  <!-- Project Title -->
  <text x="36" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#e8e8e0" letter-spacing="0.5">The Open Syllabus</text>

  <!-- Subtitle / Tagline -->
  <text x="36" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Academic Resource Discovery, Discussions &amp; Gemini AI Study Assistant</text>

  <!-- Tech Pill Tags -->
  <g transform="translate(36, 148)">
    <rect width="80" height="22" rx="4" fill="#1e293b"/>
    <text x="40" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#6db3ff" text-anchor="middle">React 19</text>
    
    <rect x="88" width="56" height="22" rx="4" fill="#1e293b"/>
    <text x="116" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Vite</text>

    <rect x="152" width="76" height="22" rx="4" fill="#1e293b"/>
    <text x="190" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Firebase</text>

    <rect x="236" width="94" height="22" rx="4" fill="#1e293b"/>
    <text x="283" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#c9a84c" text-anchor="middle">Gemini AI API</text>
    
    <rect x="338" width="112" height="22" rx="4" fill="#1e293b"/>
    <text x="394" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">● In Development</text>
  </g>
  
  <!-- Underline Accent -->
  <rect x="36" y="194" width="728" height="2" fill="url(#os-blue)"/>
</svg>
