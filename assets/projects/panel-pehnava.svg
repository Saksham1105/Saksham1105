<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <defs>
    <linearGradient id="ph-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16131d"/>
      <stop offset="60%" stop-color="#211a29"/>
      <stop offset="100%" stop-color="#0f0c16"/>
    </linearGradient>
    <linearGradient id="ph-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8e8e0" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="240" rx="12" fill="url(#ph-bg)"/>
  <rect width="798" height="238" x="1" y="1" rx="11" fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Fashion Architectural Silhouette Accent (Right side) -->
  <g opacity="0.25">
    <!-- Editorial Arches & Building Grid -->
    <path d="M 580 200 L 580 80 A 40 40 0 0 1 660 80 L 660 200" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <path d="M 605 200 L 605 100 A 15 15 0 0 1 635 100 L 635 200" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <rect x="675" y="60" width="55" height="140" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <line x1="675" y1="95" x2="730" y2="95" stroke="#c9a84c" stroke-width="1"/>
    <line x1="675" y1="130" x2="730" y2="130" stroke="#c9a84c" stroke-width="1"/>
    <line x1="675" y1="165" x2="730" y2="165" stroke="#c9a84c" stroke-width="1"/>
    
    <!-- Monogram Accent -->
    <text x="620" y="55" font-family="'Georgia', serif" font-size="28" font-weight="300" fill="#c9a84c" text-anchor="middle" letter-spacing="4">RJ01</text>
  </g>

  <!-- Left Content Info -->
  <!-- District Badge -->
  <rect x="36" y="32" width="144" height="24" rx="12" fill="#c9a84c" fill-opacity="0.15" stroke="#c9a84c" stroke-opacity="0.4" stroke-width="1"/>
  <text x="108" y="48" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#c9a84c" text-anchor="middle" letter-spacing="1.5">🏙 WEB CITY · 02</text>
  
  <!-- Project Title -->
  <text x="36" y="94" font-family="'Georgia', serif, system-ui" font-size="32" font-weight="600" fill="#e8e8e0" letter-spacing="1">Pehnava RJ01</text>

  <!-- Subtitle / Tagline -->
  <text x="36" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Premium Informational Fashion Boutique &amp; Designer Studio</text>

  <!-- Tech Pill Tags -->
  <g transform="translate(36, 148)">
    <rect width="76" height="22" rx="4" fill="#1e293b"/>
    <text x="38" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#6db3ff" text-anchor="middle">Angular</text>
    
    <rect x="84" width="76" height="22" rx="4" fill="#1e293b"/>
    <text x="122" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Node.js</text>

    <rect x="168" width="76" height="22" rx="4" fill="#1e293b"/>
    <text x="206" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Express</text>

    <rect x="252" width="84" height="22" rx="4" fill="#1e293b"/>
    <text x="294" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">MongoDB</text>
    
    <rect x="344" width="60" height="22" rx="4" fill="#1e293b"/>
    <text x="374" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#5ecca0" text-anchor="middle">● Live</text>
  </g>
  
  <!-- Underline Accent -->
  <rect x="36" y="194" width="728" height="2" fill="url(#ph-gold)"/>
</svg>
